<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AdiChat AI</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="header">
        <img src="ailogo.png" alt="AI Logo" class="logo">
        <div class="header-title">AdiChat AI</div>
        <div class="header-subtitle">Designed by Aditya Arambam</div>
    </div>

    <div class="chat-container" id="chatContainer">
        <div class="welcome-message">
            <h2>Welcome to AdiChat AI</h2>
            <p>Start a conversation by typing your message below.</p>
        </div>
    </div>

    <div class="typing-indicator" id="typingIndicator">
        <div class="typing-dot"></div>
        <div class="typing-dot"></div>
        <div class="typing-dot"></div>
    </div>

    <div class="input-container">
        <input type="text" class="message-input" id="messageInput" placeholder="Type your message..." autocomplete="off">
        <button class="send-btn" id="sendBtn">
            <svg class="send-icon" viewBox="0 0 24 24">
                <path d="M2.01 21L23 12 2.01 3 2 10l15 2-15 2z"/>
            </svg>
        </button>
    </div>

    <script>
        const chatContainer = document.getElementById('chatContainer');
        const messageInput = document.getElementById('messageInput');
        const sendBtn = document.getElementById('sendBtn');
        const typingIndicator = document.getElementById('typingIndicator');

        // API URL - uses same origin in production
        const API_URL = '/api/chat';

        let isFirstMessage = true;

        function removeWelcomeMessage() {
            if (isFirstMessage) {
                const welcome = document.querySelector('.welcome-message');
                if (welcome) welcome.remove();
                isFirstMessage = false;
            }
        }

        function addMessage(text, isUser) {
            const messageDiv = document.createElement('div');
            messageDiv.className = `message ${isUser ? 'user-message' : 'ai-message'}`;
            messageDiv.textContent = text;
            chatContainer.appendChild(messageDiv);
            scrollToBottom();
        }

        function showTyping() {
            typingIndicator.classList.add('active');
            scrollToBottom();
        }

        function hideTyping() {
            typingIndicator.classList.remove('active');
        }

        function scrollToBottom() {
            chatContainer.scrollTop = chatContainer.scrollHeight;
        }

        function showError(message) {
            const errorDiv = document.createElement('div');
            errorDiv.className = 'error-message';
            errorDiv.textContent = message;
            chatContainer.appendChild(errorDiv);
            scrollToBottom();
            setTimeout(() => errorDiv.remove(), 5000);
        }

        async function sendMessage() {
            const text = messageInput.value.trim();
            if (!text) return;

            removeWelcomeMessage();
            addMessage(text, true);
            messageInput.value = '';
            messageInput.focus();
            sendBtn.disabled = true;

            showTyping();

            try {
                const response = await fetch(API_URL, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify({ message: text })
                });

                const data = await response.json();

                if (!response.ok) {
                    throw new Error(data.error || 'Failed to get response');
                }

                hideTyping();
                addMessage(data.response, false);
            } catch (error) {
                hideTyping();
                showError('Error: ' + error.message);
            } finally {
                sendBtn.disabled = false;
            }
        }

        sendBtn.addEventListener('click', sendMessage);
        messageInput.addEventListener('keypress', (e) => {
            if (e.key === 'Enter') sendMessage();
        });

        messageInput.focus();
    </script>
</body>
</html>
